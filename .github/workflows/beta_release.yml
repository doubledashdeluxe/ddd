name: Beta release

on:
  push:
    branches-ignore: [dependabot/**]

jobs:
  tag-beta-release:
    name: Tag beta release
    if: github.repository == 'doubledashdeluxe/ddd'
    runs-on: ubuntu-26.04
    concurrency:
      group: tag-beta-release
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0
          fetch-tags: true
      - name: Tag
        run: |
          branch=$(git symbolic-ref --short HEAD)
          tag=$(git tag -n0 --sort=v:refname $branch-beta.* | tail -n 1)
          number=${tag##*.}
          number=$((number + 1)) || 1
          tag=$branch-beta.$number
          git tag $tag
          git push origin $tag
