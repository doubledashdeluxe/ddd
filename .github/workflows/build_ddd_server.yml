name: Build ddd-server

on:
  push:
    branches-ignore: [dependabot/**]
  pull_request:

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set version
        if: github.ref_type == 'tag'
        run: git describe --tags --abbrev=0 > data/version.txt
      - name: Build
        run: cargo build --release
      - name: Flood
        run: |
          cargo run --release --bin flood -- -p 2 --cookie
          cargo run --release --bin flood -- -p 2 --kx
          cargo run --release --bin flood -- -p 2 --connection
          cargo run --release --bin flood -- -p 2 --identity
          cargo run --release --bin flood -- -p 2 --search
      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: ddd-server-${{ matrix.os }}
          path: |
            target/release/ddd-server
            target/release/ddd-server.exe

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set version
        if: github.ref_type == 'tag'
        run: git describe --tags --abbrev=0 > data/version.txt
      - name: Test
        run: cargo test

  format:
    name: Format
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Format
        run: cargo fmt --check

  lint:
    name: Lint
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Lint
        run: cargo clippy --all-targets
