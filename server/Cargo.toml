[package]
name = "ddd-server"
edition = "2024"
default-run = "ddd-server"

[dependencies]
anyhow = "1.0.86"
colored = "3.1.1"
heapless = "0.9.2"
log = { version = "0.4.29", features = ["max_level_debug", "std"] }
noise-protocol = "0.2.0"
orion = "0.17.12"
rand = { version = "0.9.2", default-features = false, features = ["log", "os_rng"] }
scc = "3.5.4"
zeroize = "1.8.1"

[build-dependencies]
ddd-formats = { path = "../formats" }

[lints]
workspace = true
